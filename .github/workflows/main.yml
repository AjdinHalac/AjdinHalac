# Generates a contribution graph with a snake eating your contributions
# and publishes the SVGs to the `output` branch, which the README links to.

name: Generate Snake

on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots: first is 0 contributions, then low -> high (exactly 5).
          # Palette matches ajdinhalac.dev (ctOS cyan + DedSec magenta snake).
          outputs: |
            dist/github-snake.svg?color_snake=#ff2079&color_dots=#ebedf0,#b3fbff,#4df5ff,#00c8d6,#008c99
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff2079&color_dots=#161b22,#003a40,#00727d,#00b4c4,#00f0ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
